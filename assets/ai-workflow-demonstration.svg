<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">AI-assisted workflow demonstration</title><desc id="d">Research flows into an AI assistant, then automation, validation and human approval.</desc><defs><linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122943"/><stop offset="1" stop-color="#07111e"/></linearGradient></defs><rect width="1000" height="430" rx="24" fill="url(#wbg)"/><text x="42" y="50" fill="#a8dadc" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">FROM MANUAL TASKS TO A REVIEWABLE FLOW</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(35 105)"><rect width="165" height="190" rx="18" fill="#1b3049" stroke="#a8dadc" stroke-opacity=".55"/><circle cx="82" cy="54" r="27" fill="#a8dadc"/><path d="M70 48h24M70 58h24M70 68h15" stroke="#102033" stroke-width="4" stroke-linecap="round"/><text x="82" y="119" fill="#f5f7fb" font-size="17" font-weight="700">Research</text><text x="82" y="145" fill="#bac5d3" font-size="12">Collect inputs</text><text x="82" y="163" fill="#bac5d3" font-size="12">and requirements</text></g><path d="M204 200h33m-10-9 10 9-10 9" fill="none" stroke="#d4b36a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(245 105)"><rect width="165" height="190" rx="18" fill="#1b3049" stroke="#a8dadc" stroke-opacity=".55"/><rect x="55" y="25" width="55" height="52" rx="14" fill="#d4b36a"/><rect x="67" y="39" width="9" height="9" rx="4" fill="#102033"/><rect x="89" y="39" width="9" height="9" rx="4" fill="#102033"/><path d="M69 61q13 10 26 0" fill="none" stroke="#102033" stroke-width="3" stroke-linecap="round"/><path d="M82 25v-8m-27 24-9-6m63 6 9-6" stroke="#d4b36a" stroke-width="4" stroke-linecap="round"/><text x="82" y="119" fill="#f5f7fb" font-size="17" font-weight="700">AI assistant</text><text x="82" y="145" fill="#bac5d3" font-size="12">Draft, classify</text><tex