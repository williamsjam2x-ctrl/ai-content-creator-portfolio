-size="15" font-weight="700">approval</text><text x="60" y="163" fill="#bac5d3" font-size="11">Before release</text></g></g><text x="500" y="355" text-anchor="middle" fill="#a8dadc" font-family="Arial,sans-serif" font-size="13">EXAMPLE FLOW · EXACT TOOLS AND ACTIONS DEPEND ON THE PROJECT</text><text x="500" y="386" text-anchor="middle" fill="#bac5d3" font-family="Arial,sans-serif" font-size="12">Research → AI support → connected tools → validation → human decision</text></svg>